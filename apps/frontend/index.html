<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/PunchPro_Ver1_Titlebar.png?v=4" />
    <link rel="shortcut icon" type="image/png" href="/PunchPro_Ver1_Titlebar.png?v=4" />
    <link rel="apple-touch-icon" href="/PunchPro_Ver1_Titlebar.png?v=4" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PunchPro</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Force unregister all service workers to clear old PWA cache
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          let hasUnregistered = false;
          for(let registration of registrations) {
            registration.unregister();
            hasUnregistered = true;
          }
          if (hasUnregistered) {
            console.log('Unregistered old service workers. Reloading...');
            window.location.reload(true);
          }
        });
      }
    </script>
  </body>
</html>
